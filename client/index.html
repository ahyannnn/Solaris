<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Salfare_Logo.png" /> <!-- ✅ Change this line -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="unsafe-none" />
  <title>Salfer Engineering</title>
  <!-- Apply saved dashboard theme before paint (default: light/white; never dark on public auth pages) -->
  <script>
    try {
      var _p = window.location.pathname;
      var _isPublicAuth = _p === '/' || _p === '/login' || _p === '/register' || _p === '/forgotpassword';
      if (!_isPublicAuth && localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) { /* storage unavailable — stay light */ }
  </script>
  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>
